[project]
name = "speckle-automate-function"
version = "0.1.0"
requires-python = ">=3.13"
authors = [{ name = "Speckle Systems", email = "hello@speckle.systems" }]
maintainers = [{ name = "Speckle Systems", email = "hello@speckle.systems" }]
description = "Speckle Automate function that exports a model version to IFC4X3"
readme = "README.md"
license = "Apache-2.0"
keywords = ["speckle", "automate", "bim", "aec", "ifc", "export", "rhino"]

dependencies = [
    "specklepy[bundle]==2026.9.1",
    "ifcopenshell==0.9.0.post1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
exclude = [".venv", "**/*.yml"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "UP", # pyupgrade
    "I",  # isort
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []