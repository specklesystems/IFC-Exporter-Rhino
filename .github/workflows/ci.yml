name: "test"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
